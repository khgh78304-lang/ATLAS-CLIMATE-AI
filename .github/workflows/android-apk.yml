name: Build ATLAS CLIMATE AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK 35..."
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          echo "Android SDK installation completed."

      - name: Install dependencies
        run: npm ci

      - name: Ensure Capacitor Android
        run: |
          if ! node -e "require.resolve('@capacitor/android/package.json')" 2>/dev/null; then
            MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
            npm install --no-save "@capacitor/android@$MAJOR"
          fi

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-CLIMATE-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
